---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: daws-90s-catalogue
  namespace: {{ .Values.namespace }}
  labels:
    project: roboshop
    tier: backend
    component: daws-90s-catalogue
spec:
  # deployment reference
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: daws-90s-catalogue
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.hpa.cpuPercentage }}