---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: daws-90s-catalogue
  namespace: {{ .Values.namespace }}
  # labels related to deployment resource
  labels:
    project: roboshop
    tier: backend
    component: daws-90s-catalogue
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      tier: backend
      component: daws-90s-catalogue
  # Pod
  template:
    metadata:
      labels:
        project: roboshop
        tier: backend
        component: daws-90s-catalogue
    spec:
      containers:
      - name: daws-90s-catalogue
        image: "{{ .Values.deployment.imageRepo }}:{{ .Values.deployment.imageVersion }}"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
        envFrom:
        - configMapRef:
            name: daws-90s-catalogue